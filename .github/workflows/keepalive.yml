name: Keep Alive

# 目的：让整套系统「零维护、永久可用」。
#
# 它每天自动做两件事：
#   1. 向 Supabase 数据库发一次真实查询请求
#      → 免费项目「连续 7 天无活动自动暂停」的规则永远不会触发；
#   2. 往仓库写一行心跳时间戳并提交
#      → GitHub「仓库连续 60 天无活动则停用定时任务」的规则永远不会触发，
#        保证第 1 步能一直跑下去（否则保活任务自己会先被停掉）。
#
# 心跳提交带 [skip ci] 且已在 deploy.yml 中 paths-ignore，不会触发重新部署。

on:
  schedule:
    # 每天 UTC 21:30 → 北京时间次日 05:30
    # （GitHub 定时任务在整点最拥堵，取半点可减少延迟）
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 唤醒并保活 Supabase 数据库
        run: |
          set -euo pipefail
          BASE=$(grep '^VITE_SUPABASE_URL='      .env.production | cut -d= -f2-)
          KEY=$(grep  '^VITE_SUPABASE_ANON_KEY=' .env.production | cut -d= -f2-)
          echo "目标项目：$BASE"

          # 免费项目被暂停后首次唤醒较慢，最多重试 5 次、每次间隔 20 秒
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/resp.txt -w '%{http_code}' --max-time 45 \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              "$BASE/rest/v1/calendar_events?select=id&limit=1" || echo 000)
            echo "第 $i 次探测 → HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✓ 数据库在线，活跃计时已重置"
              exit 0
            fi
            head -c 300 /tmp/resp.txt || true; echo
            sleep 20
          done

          echo "::error::连续 5 次无法访问数据库，请到 Supabase 后台查看项目状态"
          exit 1

      - name: 写入心跳时间戳（防止定时任务被自动停用）
        run: |
          set -euo pipefail
          mkdir -p .github
          {
            echo "最近一次自动保活：$(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            echo "（北京时间 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')）"
            echo
            echo "此文件由 .github/workflows/keepalive.yml 每天自动更新，"
            echo "作用是保持仓库活跃，请勿删除。"
          } > .github/last-keepalive.txt

          git config user.name  'keepalive-bot'
          git config user.email 'keepalive-bot@users.noreply.github.com'
          git add .github/last-keepalive.txt
          git diff --staged --quiet && { echo "内容无变化，跳过提交"; exit 0; }
          git commit -m "chore: 自动保活心跳 $(date -u '+%Y-%m-%d') [skip ci]"
          git push
          echo "✓ 心跳已提交"
