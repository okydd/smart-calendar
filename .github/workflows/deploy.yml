name: Deploy to GitHub Pages

# 注意：本工作流会以 force_orphan 方式把 dist/ 强制覆盖到 gh-pages，
# 会清空 versions/ 历史快照目录，导致「版本回退」功能失效。
# 自 2026-08-06 起，网页部署统一走 scripts/deploy-ghpages.mjs（Git Data API），
# 它会完整保留 versions/<版本>/ 快照。因此此处不再监听 push 自动触发，避免误清空快照。
# 如需手动全量发布（会清空 versions/ 快照，慎用），请在 Actions 页面手动触发本工作流。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # 云同步参数来自仓库根目录的 .env.production
        # （VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY）。
        # anon key 属于公开密钥，配合数据库行级安全策略 RLS 使用，可安全放入仓库。
        run: npm run build

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Deploy to GitHub Pages (gh-pages branch)
        # 直接把构建产物推送到 gh-pages 分支，绕过易卡死的 deployment-queue API
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
