    <!--
      白屏兜底（必须放在所有 module 脚本之前）。
      React 的 ErrorBoundary 只能捕获「渲染阶段」错误；如果整个 JS 包在
      解析 / 模块求值阶段就抛错（例如某个第三方模块在安卓 WebView 里不兼容），
      React 根本没机会执行，页面就是纯白板。
      这段脚本记录首个致命错误，并在 4 秒后检查 #root 是否仍为空，
      是则渲染一个可读、可操作的错误面板，避免用户只看到白屏。
    -->
    <script>
      (function () {
        var fatal = [];
        function push(msg) {
          if (msg && fatal.indexOf(msg) === -1) fatal.push(msg);
        }
        window.addEventListener('error', function (e) {
          if (e && e.target && e.target !== window && e.target.tagName) {
            push('资源加载失败：' + (e.target.src || e.target.href || e.target.tagName));
            return;
          }
          push((e && e.message ? e.message : '未知脚本错误') + (e && e.filename ? '\n@ ' + e.filename + ':' + e.lineno : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          push('未处理的异步错误：' + (r && r.message ? r.message : String(r)));
        });
        window.__bootFatal = fatal;

        function esc(s) {
          return String(s).replace(/[&<>]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
          });
        }

        function diag() {
          var sw = 'unknown';
          try {
            if (!('serviceWorker' in navigator)) sw = '不支持';
            else if (navigator.serviceWorker.controller) sw = '已控制本页';
            else sw = '未控制';
          } catch (_) {}
          return [
            'UA: ' + navigator.userAgent,
            'URL: ' + location.href,
            '在线状态: ' + (navigator.onLine ? '在线' : '离线'),
            'ServiceWorker: ' + sw,
            '文档状态: ' + document.readyState
          ].join('\n');
        }

        // 以「纯网络全新加载」方式跳转：先等旧 SW 注销 + 缓存清空，再标记 __freshLoad，
        // main.tsx 识别该标记后会跳过 SW 注册与版本自动刷新，避免被旧 SW 重新接管。
        function freshReload() {
          var finish = function () {
            try { sessionStorage.setItem('__freshLoad', '1'); } catch (_) {}
            location.replace(location.pathname + '?_r=' + Date.now() + (location.hash || ''));
          };
          var clearCaches = function () {
            if (window.caches && caches.keys) {
              return caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }).catch(function () {});
            }
            return Promise.resolve();
          };
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }).then(clearCaches).then(finish, finish);
            } else {
              clearCaches().then(finish, finish);
            }
          } catch (_) {
            finish();
          }
        }

        // 错误面板做成「浮层」而非替换 #root：即使短时出现，也不会破坏已渲染的页面；
        // App 一旦挂载会通过 window.__hideBootFallback 把它移除。
        function showFallback() {
          if (document.getElementById('bootFallback')) return;
          var detail = (fatal.length ? fatal.join('\n\n') + '\n\n' : '') + '—— 环境信息 ——\n' + diag();
          var box = document.createElement('div');
          box.id = 'bootFallback';
          box.setAttribute('style', 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font:14px/1.7 -apple-system,BlinkMacSystemFont,\'PingFang SC\',\'Microsoft YaHei\',sans-serif;color:#1f2329;background:rgba(245,246,250,.98)');
          box.innerHTML =
            '<div style="max-width:520px;width:100%;background:#fff;border:1px solid #e5e6eb;border-radius:14px;padding:22px 20px;box-shadow:0 6px 24px rgba(0,0,0,.06)">' +
            '<div style="font-size:17px;font-weight:600;margin-bottom:6px">页面未能正常启动</div>' +
            '<div style="color:#646a73;margin-bottom:14px">已为你保留本地数据，不会丢失。请先尝试「清除缓存并重载」（会跳过 Service Worker，以纯网络方式重新加载）。</div>' +
            '<pre id="bootErr" style="white-space:pre-wrap;word-break:break-all;background:#f7f8fa;border:1px solid #eceef1;border-radius:8px;padding:10px;max-height:190px;overflow:auto;color:#8a2b2b;font-size:12px;margin:0 0 16px">' +
            esc(detail) +
            '</pre>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
            '<button id="btnReload" style="flex:1;min-width:130px;height:40px;border:0;border-radius:8px;background:#3b7cff;color:#fff;font-size:14px">重新加载</button>' +
            '<button id="btnHard" style="flex:1;min-width:130px;height:40px;border:1.5px solid #bfbfbf;border-radius:8px;background:#fff;color:#1f2329;font-size:14px">清除缓存并重载</button>' +
            '<button id="btnCopy" style="flex:1;min-width:130px;height:40px;border:1.5px solid #bfbfbf;border-radius:8px;background:#fff;color:#1f2329;font-size:14px">复制错误信息</button>' +
            '</div></div>';

          (document.body || document.documentElement).appendChild(box);
          document.getElementById('btnReload').onclick = function () { location.reload(); };
          document.getElementById('btnHard').onclick = function () { freshReload(); };
          document.getElementById('btnCopy').onclick = function () {
            try {
              navigator.clipboard.writeText(detail);
              document.getElementById('btnCopy').textContent = '已复制';
            } catch (_) {
              var ta = document.createElement('textarea');
              ta.value = detail;
              document.body.appendChild(ta);
              ta.select();
              try { document.execCommand('copy'); document.getElementById('btnCopy').textContent = '已复制'; } catch (__) {}
              document.body.removeChild(ta);
            }
          };
        }

        // App 挂载后调用：标记就绪并移除浮层（若存在）。即使浮层曾短暂出现也会被清掉。
        window.__hideBootFallback = function () {
          try { window.__appReady = true; } catch (_) {}
          var fb = document.getElementById('bootFallback');
          if (fb && fb.parentNode) fb.parentNode.removeChild(fb);
        };

        // 判断是否为「可恢复」的加载类致命错误：资源/模块/chunk 加载失败。
        // 这类错误多因部署后 CDN 传播不一致（某个 JS chunk 暂时缺失）导致，
        // 纯网络重试一次通常即可自愈；其余异步错误不触发自动重试，避免误刷。
        function recoverable(f) {
          return /资源加载失败|动态导入|dynamically imported|Loading chunk|ChunkLoadError|模块脚本|module script|Failed to fetch dynamically/i.test(f);
        }

        // 轮询式检测：已挂载（__appReady 或 root 有内容）则正常；
        // 若捕获到「可恢复的加载错误」且在线，先纯网络重试一次（自愈合，用户通常无感）；
        // 重试后仍失败，或已挂载却带可恢复致命错误，则弹出浮层供手动恢复；
        // 否则文档加载完成且 root 仍为空，才判定为真正失败而弹面板。
        var shown = false;
        function maybeShow() {
          if (shown) return;
          var root = document.getElementById('root');
          var mounted = window.__appReady || (root && root.childElementCount > 0);
          // 可恢复加载错误 + 在线 + 未重试过 → 纯网络全新加载一次（自愈）
          if (fatal.some(recoverable) && navigator.onLine && !sessionStorage.getItem('__autoRetry')) {
            try { sessionStorage.setItem('__autoRetry', '1'); } catch (_) {}
            freshReload();
            return;
          }
          // 已挂载但存在可恢复致命错误（如某 chunk 加载失败）→ 弹浮层，避免静默白屏
          if (mounted && fatal.some(recoverable)) {
            shown = true;
            showFallback();
            return;
          }
          if (mounted) return; // 正常挂载，无需面板
          if (document.readyState !== 'complete') return;
          shown = true;
          showFallback();
        }
        window.addEventListener('load', maybeShow);
        setTimeout(maybeShow, 4000);
        setTimeout(maybeShow, 8000);
        setTimeout(maybeShow, 15000);
      })();
    </script>
